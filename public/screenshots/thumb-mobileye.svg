      <g transform="translate(24, 180)">
        <rect x="0" y="0" width="232" height="34" rx="8" fill="#1e293b" fill-opacity="0.6" />
        <text x="14" y="22" fill="#cbd5e1" font-family="monospace" font-size="12">☸️ Kubernetes &amp; Argo</text>

        <rect x="0" y="44" width="232" height="34" rx="8" fill="#1e293b" fill-opacity="0.6" />
        <text x="14" y="66" fill="#cbd5e1" font-family="monospace" font-size="12">☁️ AWS S3 / Glacier Lake</text>

        <rect x="0" y="88" width="232" height="34" rx="8" fill="#1e293b" fill-opacity="0.6" />
        <text x="14" y="110" fill="#cbd5e1" font-family="monospace" font-size="12">🗂️ 12k+ Indexed Datasets</text>

        <rect x="0" y="132" width="232" height="28" rx="6" fill="#6366f1" fill-opacity="0.15" />
        <text x="14" y="151" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="600">5,000 Session Rerun Campaigns</text>
      </g>
    </g>

    <!-- Connector 3 -->
    <path d="M 1030 310 L 1090 310" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" />
    <polygon points="1100,310 1088,303 1088,317" fill="#10b981" />

    <!-- Module 4: 98% Latency Cut & Fast Query Engine -->
    <g transform="translate(1110, 130)">
      <rect x="0" y="0" width="280" height="360" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
      <rect x="24" y="24" width="48" height="48" rx="12" fill="#10b981" fill-opacity="0.2" />
      <text x="36" y="55" fill="#34d399" font-size="24">⚡</text>
      
      <text x="24" y="115" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">
        Fast Triage Index
      </text>
      <text x="24" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
        Bottleneck remediation
      </text>

      <g transform="translate(24, 180)">
        <rect x="0" y="0" width="232" height="34" rx="8" fill="#1e293b" fill-opacity="0.6" />
        <text x="14" y="22" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">🚀 98% Latency Cut</text>

        <rect x="0" y="44" width="232" height="34" rx="8" fill="#1e293b" fill-opacity="0.6" />
        <text x="14" y="66" fill="#cbd5e1" font-family="monospace" font-size="12">⏱️ 90s Down to &lt;2s Triage</text>

        <rect x="0" y="88" width="232" height="34" rx="8" fill="#1e293b" fill-opacity="0.6" />
        <text x="14" y="110" fill="#cbd5e1" font-family="monospace" font-size="12">🧠 Algorithm Validation</text>

        <rect x="0" y="132" width="232" height="28" rx="6" fill="#10b981" fill-opacity="0.15" />
        <text x="14" y="151" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Zero Blocking Dependencies</text>
      </g>
    </g>

    <!-- Bottom Stat Summary Bar -->
    <g transform="translate(0, 540)">
      <rect x="0" y="0" width="1400" height="230" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- Stat 1 -->
      <g transform="translate(60, 45)">
        <text x="0" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900">30+</text>
        <text x="0" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">ADAS &amp; AV Projects</text>
        <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Inception to Data Readiness</text>
      </g>
      <line x1="340" y1="40" x2="340" y2="180" stroke="#334155" stroke-width="1" />

      <!-- Stat 2 -->
      <g transform="translate(400, 45)">
        <text x="0" y="45" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900">98%</text>
        <text x="0" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Triage Latency Cut</text>
        <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">90s down to &lt;2s on Cloud Logs</text>
      </g>
      <line x1="680" y1="40" x2="680" y2="180" stroke="#334155" stroke-width="1" />

      <!-- Stat 3 -->
      <g transform="translate(740, 45)">
        <text x="0" y="45" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900">14 Days</text>
        <text x="0" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">10-Gate Protocol</text>
        <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Onboarding down from months</text>
      </g>
      <line x1="1020" y1="40" x2="1020" y2="180" stroke="#334155" stroke-width="1" />

      <!-- Stat 4 -->
      <g transform="translate(1080, 45)">
        <text x="0" y="45" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900">12,000+</text>
        <text x="0" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Production Datasets</text>
        <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Cataloged &amp; Validated</text>
      </g>
    </g>
  </g>
</svg>
